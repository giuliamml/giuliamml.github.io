  <script>
    function initVanta() {
      const maxRetries = 50;
      let retries = 0;

      function attemptInit() {
        retries++;
        if (window.VANTA && window.VANTA.TOPOLOGY && !window.vantaEffect) {
          try {
            window.vantaEffect = window.VANTA.TOPOLOGY({
              el: '#vanta-bg',
              mouseControls: true,
              touchControls: true,
              gyroControls: false,
              minHeight: 200.0,
              minWidth: 200.0,
              scale: 1.2,
              scaleMobile: 1.2,
              backgroundColor: 0x0d0d0d,
              color: 0xffd783,
            });
            console.log('✓ Vanta background initialized successfully');
          } catch (e) {
            console.error('✗ Vanta initialization error:', e);
          }
        } else if (retries < maxRetries) {
          setTimeout(attemptInit, 200);
        } else {
          console.warn('✗ Vanta failed to load after retries. VANTA:', window.VANTA);
        }
      }
      attemptInit();
    }

    // Initialize on DOM ready or immediately if already loaded
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initVanta);
    } else {
      initVanta();
    }
  </script>
